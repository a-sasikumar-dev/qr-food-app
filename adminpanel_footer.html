<script type="text/javascript">
// Submenus open script add active class script
$('.admin-sidebar .sidebar-menu .admin-submenu-li .admin-submenus').hide();
$(".admin-sidebar .admin-submenu-li a").click(function () {
  $(this).toggleClass('active');
  $(this).parent(".admin-submenu-li").children("ul").slideToggle("100");
});
</script>
<script type="text/javascript">
// Submenus open unwanted active class remove script
  $(".admin-submenus li a").click(function () {
    $(this).removeClass('active');
});
</script>
<script type="text/javascript">
// Current page active script
  jQuery(function($) {
     var path = window.location.href; // because the 'href' property of the DOM element is the absolute path
     $('.admin-sidebar .sidebar-menu a').each(function() {
      if (this.href === path) {
       $(this).addClass('active');
      }
     });
    });
</script>
<script>
    $("input[type='number']").inputSpinner()
