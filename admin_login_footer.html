<script type="text/javascript">
	$('.admin-form-cont').find('.form-control').focus(function() {
  		$(this).parent('.label-grp').addClass('focus');
	});
	$('.admin-form-cont').find('.form-control').blur(function() {
  		if ($(this).val().length == 0) {
    	$(this).parent('.label-grp').removeClass('focus');
  		}
	});
</script>

<script type="text/javascript">
	$('.admin-form-cont').find('.form-control').focus(function() {

	$('.admin-form-cont').find('.form-control').blur(function() {
  		if ($(this).val().length == 0) {
    	$('.country-code').removeClass('focus');
  		}
	});
</script>
